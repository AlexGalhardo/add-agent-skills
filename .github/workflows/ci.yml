name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Validate npm package (publint + are-the-types-wrong)
        run: bun run check:package
      - name: Validate JSR package (slow types, files)
        run: bunx jsr publish --dry-run
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  node-compat:
    name: Smoke test on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --omit=dev --ignore-scripts
      - run: node dist/cli.js --version
      - run: node dist/cli.js --list
      - name: Install a real skill from GitHub
        run: node dist/cli.js --skills karpathy-guidelines --agent claude --dir "$RUNNER_TEMP/app" --yes
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: test -s "$RUNNER_TEMP/app/.claude/skills/karpathy-guidelines/SKILL.md"

  bun-compat:
    name: Smoke test on Bun
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: oven-sh/setup-bun@v2
      - run: bun install --production --ignore-scripts
      - run: bun dist/cli.js --version
      - run: bun dist/cli.js --list
      - name: Install a real skill from GitHub (built CLI and sources)
        run: |
          bun dist/cli.js --skills karpathy-guidelines --agent agents --dir "$RUNNER_TEMP/app" --yes
          bun src/bin.ts --skills grill-me --agent claude --dir "$RUNNER_TEMP/app" --yes
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          test -s "$RUNNER_TEMP/app/.agents/skills/karpathy-guidelines/SKILL.md"
          test -s "$RUNNER_TEMP/app/.claude/skills/grill-me/SKILL.md"

  deno-compat:
    name: Smoke test on Deno
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Only the CLI's own dependencies (not the dev toolchain).
      - run: deno install --entrypoint src/bin.ts
      - run: deno check src/mod.ts src/bin.ts
      - run: deno run -A src/bin.ts --list
      - name: Install a real skill from GitHub
        run: deno run -A src/bin.ts --skills karpathy-guidelines --agent cursor --dir "$RUNNER_TEMP/app" --yes
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: test -s "$RUNNER_TEMP/app/.cursor/skills/karpathy-guidelines/SKILL.md"
